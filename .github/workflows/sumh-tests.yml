name: SUMH regression tests

on:
  push:
    branches: [main, dev, 'feat/*']
    paths:
      # Broad dependency roots deliberately include shared JSON, JNI, policy,
      # resources and build integration, not only files with SUMH in their name.
      - 'kernel/**'
      - 'uapi/**'
      - 'userspace/**'
      - 'manager/**'
      - 'cmake/**'
      - 'scripts/ci/**'
      - '.github/actions/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'kernel/**'
      - 'uapi/**'
      - 'userspace/**'
      - 'manager/**'
      - 'cmake/**'
      - 'scripts/ci/**'
      - '.github/actions/**'
      - '.github/workflows/**'
  workflow_dispatch:
  # Local reusable-workflow calls check out the caller's exact commit. The
  # release workflow calls this on tags as well, without path-filter bypasses.
  workflow_call:
    outputs:
      commit_sha:
        description: Commit verified by both native and Manager regressions
        value: ${{ jobs.gate.outputs.commit_sha }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      commit_sha: ${{ steps.tests.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify regression runner and release gate
        run: python3 -B -m unittest discover -s scripts/ci -p 'test_sumh_ci.py'
      - name: Run kernel, userspace, daemon and mount entrypoints
        id: tests
        run: python3 scripts/ci/sumh_ci.py host --report out/sumh-ci/native.json
      - name: Upload native results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SUMH-native-results
          path: out/sumh-ci/native.json
          if-no-files-found: warn

  manager-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit_sha: ${{ steps.tests.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare temporary test signing key
        uses: ./.github/actions/setup-manager-signing
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - name: Run SUMH JVM and Compose regressions
        id: tests
        working-directory: manager
        run: |
          ./gradlew :app:testDebugUnitTest --tests 'com.zying.zysu.ui.sumh.*' --build-cache --no-daemon -PABI=arm64-v8a
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload Manager test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SUMH-Manager-results
          path: |
            manager/app/build/reports/tests/testDebugUnitTest/
            manager/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

  gate:
    name: Require SUMH regression success
    needs: [host-tests, manager-tests]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.gate.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Summarize and require both jobs at this commit
        id: gate
        env:
          SUMH_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/sumh_ci.py gate --report out/sumh-ci/gate.json
      - name: Upload gate result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SUMH-gate-result
          path: out/sumh-ci/gate.json
          if-no-files-found: warn
