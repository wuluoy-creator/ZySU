name: Manager discovery regressions

on:
  push:
    branches: [main]
    paths:
      - 'kernel/Kbuild'
      - 'kernel/manager/**'
      - 'kernel/core/init.c'
      - 'kernel/hook/**'
      - 'kernel/supercall/**'
      - 'uapi/supercall.h'
      - 'kernel/include/util.h'
      - 'scripts/ci/test_manager_scan.py'
      - 'scripts/ci/test_superkey.py'
      - 'manager/app/src/main/cpp/ksu.c'
      - 'scripts/ci/test_sumh_vfs_helpers.py'
      - '.github/workflows/manager-tests.yml'
  pull_request:
    paths:
      - 'kernel/Kbuild'
      - 'kernel/manager/**'
      - 'kernel/core/init.c'
      - 'kernel/hook/**'
      - 'kernel/supercall/**'
      - 'uapi/supercall.h'
      - 'kernel/include/util.h'
      - 'scripts/ci/test_manager_scan.py'
      - 'scripts/ci/test_superkey.py'
      - 'manager/app/src/main/cpp/ksu.c'
      - 'scripts/ci/test_sumh_vfs_helpers.py'
      - '.github/workflows/manager-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pinned manager discovery and authentication
        run: python3 scripts/ci/test_manager_scan.py --cc clang
      - name: SuperKey configuration and first authentication
        run: python3 scripts/ci/test_superkey.py --cc clang
