name: ksud and ksuinit regressions

on:
  push:
    branches: [main, dev, 'feat/*']
    paths:
      - 'userspace/ksud/src/**'
      - 'userspace/ksud/tests/**'
      - 'userspace/ksud/scripts/**'
      - 'userspace/ksud/third_party/MagiskbootAlone'
      - 'userspace/ksuinit/**'
      - 'userspace/common/**'
      - 'uapi/**'
      - 'kernel/policy/feature.*'
      - 'kernel/policy/allowlist.*'
      - 'kernel/feature/shell_su_adb_only.*'
      - 'kernel/feature/module_blacklist.*'
      - 'kernel/supercall/dispatch.c'
      - 'scripts/ci/test_boot_config.py'
      - '.github/workflows/userspace-tests.yml'
  pull_request:
    paths:
      - 'userspace/ksud/src/**'
      - 'userspace/ksud/tests/**'
      - 'userspace/ksud/scripts/**'
      - 'userspace/ksud/third_party/MagiskbootAlone'
      - 'userspace/ksuinit/**'
      - 'userspace/common/**'
      - 'uapi/**'
      - 'kernel/policy/feature.*'
      - 'kernel/policy/allowlist.*'
      - 'kernel/feature/shell_su_adb_only.*'
      - 'kernel/feature/module_blacklist.*'
      - 'kernel/supercall/dispatch.c'
      - 'scripts/ci/test_boot_config.py'
      - '.github/workflows/userspace-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize magiskboot for repack regressions
        run: git submodule update --init userspace/ksud/third_party/MagiskbootAlone
      - name: ELF, boot images, bootstrap linking and existing parsers
        run: python3 userspace/ksud/tests/run_host_tests.py --cxx clang++ --sanitize
      - name: Selected boot image patching and target KMI
        run: python3 userspace/ksud/tests/run_boot_patch_host_tests.py --cxx clang++ --sanitize
      - name: Boot config, forced features and shell ancestry
        run: |
          python3 userspace/ksud/tests/run_boot_config_host_tests.py --cxx clang++ --sanitize
          python3 scripts/ci/test_boot_config.py --cc clang
      - name: Boot and init_boot partial-write recovery
        run: python3 userspace/ksud/tests/run_boot_patch_v2_flash_host_tests.py --cxx clang++ --sanitize
      - name: Repack output integrity and I/O failures
        run: python3 userspace/ksud/tests/run_repack_host_tests.py --cxx clang++ --sanitize
      - name: Module management and configuration
        run: python3 userspace/ksud/tests/run_module_host_tests.py --cxx clang++
      - name: Script deadlines and signal masks
        run: python3 userspace/ksud/tests/run_script_wait_host_tests.py --cxx clang++
      - name: Process execution and file I/O
        run: python3 userspace/ksud/tests/run_runtime_host_tests.py --cxx clang++
      - name: Boot-property timing, readback and retries
        run: python3 userspace/ksud/tests/run_hide_bootloader_host_tests.py --cxx clang++
      - name: Init handoff, module parser and vermagic with sanitizers
        run: python3 userspace/ksuinit/tests/run_host_tests.py --cxx clang++ --sanitize
      - name: Embedded assets
        run: python3 userspace/ksud/scripts/test_embed_assets.py
