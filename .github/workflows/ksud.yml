name: Build ksud
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
        description: "Target architecture: aarch64 only"
      os:
        required: false
        type: string
        default: ubuntu-latest
      pack_lkm:
        required: false
        type: boolean
        default: true
      kmi:
        description: 'Embedded KMI: all, a single KMI, or a comma-separated list'
        required: false
        type: string
        default: all
      pack_ksuinit:
        required: false
        type: boolean
        default: true
      ksud_version_name:
        description: 'ksud 版本，如 1.8.1；留空跟随标签/Git'
        type: string
        default: ''
      ksud_version_code:
        description: 'ksud 数字版本；留空自动生成'
        type: string
        default: ''
    secrets:
      GPG_PRIVATE_KEY:
        required: false
      GPG_PASSPHRASE:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        shell: bash
    env:
      BUILD_TARGET: ${{ inputs.target }}
      ZYSU_KSUD_VERSION_NAME: ${{ inputs.ksud_version_name }}
      ZYSU_KSUD_VERSION_CODE: ${{ inputs.ksud_version_code }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # The generated version code depends on the complete main-repo history.
        fetch-depth: 0

    - name: Initialize ksud dependencies
      run: |
        git submodule update --init --recursive --depth 1 --jobs "$(nproc)" \
          userspace/ksud/third_party/MagiskbootAlone \
          userspace/ksud/third_party/bootctlAlone \
          userspace/ksud/third_party/resetpropAlone \
          userspace/ksud/third_party/ndk-busybox \
          userspace/ksud/third_party/mkbootfsAlone \
          userspace/ksud/third_party/readelf_toyboxAlone

    - name: Set up native build cache
      uses: ./.github/actions/setup-native-build
      with:
        component: ksud-${{ inputs.target }}

    - name: Download LKM artifacts
      if: ${{ inputs.pack_lkm }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        pattern: '*-lkm'

    - name: Download ksuinit artifact
      if: ${{ inputs.pack_ksuinit }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: ksuinit-${{ inputs.target }}
        path: ksuinit-${{ inputs.target }}

    - name: Prepare LKM files
      if: ${{ inputs.pack_lkm }}
      env:
        SELECTED_KMI: ${{ inputs.kmi }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os
        from pathlib import Path
        import shutil

        # Keep this list in sync with build-lkm.yml and scripts/build.*.
        supported = [
            "android14-6.1", "android15-6.6",
            "android16-6.12", "android17-6.18",
        ]
        requested = os.environ["SELECTED_KMI"].strip()
        selected = supported if requested == "all" else [item.strip() for item in requested.split(",")]
        if any(kmi not in supported for kmi in selected):
            raise SystemExit(f"::error::Unsupported KMI selection: {requested}")
        assets = Path("userspace/ksud/assets")
        assets.mkdir(parents=True, exist_ok=True)
        for old_lkm in assets.glob("*_kernelsu.ko"):
            old_lkm.unlink()
        for kmi in dict.fromkeys(selected):
            lkm = Path(f"{kmi}-lkm/{kmi}_kernelsu.ko")
            if not lkm.is_file() or lkm.stat().st_size == 0:
                raise SystemExit(f"::error::Required LKM artifact missing or empty: {lkm}")
            shutil.copy2(lkm, assets)
        PY
        echo "Embedded LKM assets:"
        ls -lh ./userspace/ksud/assets/*_kernelsu.ko
    
    - name: Prepare ksuinit
      if: ${{ inputs.pack_ksuinit }}
      run: |
        set -euo pipefail
        mkdir -p ./userspace/ksud/assets
        test -s "ksuinit-$BUILD_TARGET/ksuinit"
        cp "ksuinit-$BUILD_TARGET/ksuinit" ./userspace/ksud/assets/

    - name: Determine target settings
      id: target
      run: |
        case "$BUILD_TARGET" in
          aarch64-linux-android|aarch64)
            echo "arch=aarch64" >> "$GITHUB_OUTPUT"
            echo "abi=arm64-v8a" >> "$GITHUB_OUTPUT"
            echo "android_target=aarch64-linux-android31" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "ZySU supports aarch64 only, got: $BUILD_TARGET"
            exit 1
            ;;
        esac

    - name: Build ksud
      run: |
        set -euo pipefail
        cd userspace/ksud
        mkdir -p build && cd build
        
        # Cross-compile using Android NDK toolchain
        TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
        export CC="$TOOLCHAIN/bin/${{ steps.target.outputs.android_target }}-clang"
        export CXX="$TOOLCHAIN/bin/${{ steps.target.outputs.android_target }}-clang++"
        export AR="$TOOLCHAIN/bin/llvm-ar"
        export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
        export STRIP="$TOOLCHAIN/bin/llvm-strip"
        
        cmake .. \
          -G Ninja \
          -DCMAKE_SYSTEM_NAME=Android \
          -DCMAKE_ANDROID_ARCH_ABI="${{ steps.target.outputs.abi }}" \
          -DCMAKE_ANDROID_NDK="$ANDROID_NDK_HOME" \
          -DCMAKE_SYSTEM_VERSION=31 \
          -DCMAKE_C_COMPILER="$CC" \
          -DCMAKE_CXX_COMPILER="$CXX" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_BUILD_TYPE=Release \
          -DZYSU_ENABLE_CLANG_TIDY=OFF

        # Bind the configured inputs before the first build, including staged
        # LKM/ksuinit assets and the resolved native dependency sources.
        python3 "$GITHUB_WORKSPACE/scripts/ci/native_provenance.py" snapshot \
          --repo "$GITHUB_WORKSPACE" --target ksud --build-dir "$PWD" \
          --out "$GITHUB_WORKSPACE/out/native-provenance/ksud" \
          --artifact "ksud=$PWD/ksud" \
          --artifact "ksud.unstripped=$PWD/symbols/ksud.unstripped" \
          --dependencies "$PWD/native-dependencies.json"

        cmake --build . --target ksud --parallel "$(nproc)"
        
        # Show binary info
        ls -lh ksud
        file ksud

    - name: Verify native hardening rejection cases
      run: |
        python3 scripts/ci/test_native_hardening.py \
          --build-dir userspace/ksud/build --target ksud --linkage dynamic \
          --readelf "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

    - name: Finalize and verify native provenance
      run: |
        set -euo pipefail
        python3 scripts/ci/native_provenance.py finalize \
          --snapshot out/native-provenance/ksud/source-snapshot.json
        python3 scripts/ci/native_provenance.py verify \
          --manifest out/native-provenance/ksud/build-manifest.json

    - name: Verify final ELF embedded payload bytes
      run: |
        set -euo pipefail
        python3 scripts/ci/embedded_payloads.py create \
          --native-manifest out/native-provenance/ksud/build-manifest.json \
          --binary userspace/ksud/build/ksud \
          --generated-cpp userspace/ksud/build/generated/assets_data.cpp \
          --assets-dir userspace/ksud/assets \
          --output-dir out/native-provenance/ksud/embedded
        python3 scripts/ci/embedded_payloads.py verify \
          --proof out/native-provenance/ksud/embedded/manifest.json \
          --binary userspace/ksud/build/ksud \
          --native-manifest out/native-provenance/ksud/build-manifest.json

    - name: Sign ksud when a GPG key is configured
      if: ${{ github.event_name != 'pull_request' }}
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        set -euo pipefail
        if [ -z "$GPG_PRIVATE_KEY" ]; then
          echo "No GPG key configured; uploading the unsigned ksud binary."
          exit 0
        fi
        export GNUPGHOME
        GNUPGHOME=$(mktemp -d "$RUNNER_TEMP/ksud-gpg.XXXXXX")
        trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
        printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --yes --pinentry-mode loopback \
          --passphrase "$GPG_PASSPHRASE" --import
        gpg --detach-sign --batch --yes --pinentry-mode loopback \
          --passphrase "$GPG_PASSPHRASE" \
          --output userspace/ksud/build/ksud.sig userspace/ksud/build/ksud
        gpg --verify userspace/ksud/build/ksud.sig userspace/ksud/build/ksud

    - name: Show compiler cache statistics
      run: ccache --show-stats

    - name: Upload ksud artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ksud-${{ inputs.target }}
        path: |
          userspace/ksud/build/ksud
          userspace/ksud/build/ksud.sig
        if-no-files-found: error

    - name: Upload matching ksud diagnostic symbols
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ksud-symbols-${{ inputs.target }}
        path: userspace/ksud/build/symbols/ksud.unstripped
        if-no-files-found: error

    - name: Upload ksud provenance and native license evidence
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ksud-provenance-${{ inputs.target }}
        path: out/native-provenance/ksud/
        if-no-files-found: error
