name: Set up native build cache
description: Validate the Android NDK and restore a component-specific C/C++ compiler cache.
inputs:
  component:
    description: Cache namespace for the native component.
    required: true
outputs:
  available:
    description: Whether ccache is available for this build.
    value: ${{ steps.toolchain.outputs.available }}
  launcher:
    description: Compiler launcher path, or an empty value when caching is unavailable.
    value: ${{ steps.toolchain.outputs.launcher }}
runs:
  using: composite
  steps:
    - name: Set up ccache
      id: toolchain
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/setup.sh"

    - name: Restore compiler cache
      if: steps.toolchain.outputs.available == 'true'
      continue-on-error: true
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/ccache
        key: native-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.component }}-${{ steps.toolchain.outputs.ndk }}-${{ github.sha }}
        restore-keys: |
          native-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.component }}-${{ steps.toolchain.outputs.ndk }}-

    - name: Reset cache statistics
      if: steps.toolchain.outputs.available == 'true'
      continue-on-error: true
      shell: bash
      run: ccache --zero-stats
